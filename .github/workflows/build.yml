
name: Build NEXUS CLIENT

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q NEXUS-CLIENT-Fabric-1.21.11.zip -d unpacked

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Compile mod
        working-directory: unpacked/NEXUS-CLIENT
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-CLIENT-JAR
          path: unpacked/NEXUS-CLIENT/build/libs/*.jar
          if-no-files-found: error
          
